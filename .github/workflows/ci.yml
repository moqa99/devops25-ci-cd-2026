
name: NEXUS CI/CD Pipeline

on:
  push:
    branches:
      - main
      - "demo/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_TAG: nexus-cicd-api:${{ github.sha }}

jobs:
  test-and-lint:
    name: Test and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v --junitxml=test-results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results
          path: test-results.xml
          if-no-files-found: error
          retention-days: 14

      - name: Run Ruff
        run: python -m ruff check app tests

  docker-build:
    name: Build Docker Image
    needs: test-and-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t "$IMAGE_TAG" .

      - name: Verify Docker image
        run: docker image inspect "$IMAGE_TAG"

      - name: Export Docker image
        run: |
          docker save -o nexus-cicd-api.tar "$IMAGE_TAG"
          sha256sum nexus-cicd-api.tar > nexus-cicd-api.tar.sha256

      - name: Upload Docker artifact
        uses: actions/upload-artifact@v7
        with:
          name: nexus-docker-image
          path: |
            nexus-cicd-api.tar
            nexus-cicd-api.tar.sha256
          if-no-files-found: error
          retention-days: 3

  deploy-simulated:
    name: Simulated Deployment
    needs: docker-build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Download Docker artifact
        uses: actions/download-artifact@v8
        with:
          name: nexus-docker-image

      - name: Verify image archive
        run: sha256sum -c nexus-cicd-api.tar.sha256

      - name: Load Docker image
        run: |
          docker load -i nexus-cicd-api.tar
          docker image inspect "$IMAGE_TAG"

      - name: Start application
        run: |
          docker run -d \
            --name nexus-cicd-cd \
            -p 127.0.0.1:8000:8000 \
            "$IMAGE_TAG"

      - name: Verify application health
        run: |
          for attempt in {1..15}; do
            if curl -fsS http://127.0.0.1:8000/health -o health.json; then
              python3 -c 'import json; assert json.load(open("health.json")) == {"status": "ok"}'
              echo "Health check passed"
              exit 0
            fi
            sleep 2
          done
          docker logs nexus-cicd-cd
          exit 1

      - name: Verify deployed version
        run: |
          curl -fsS http://127.0.0.1:8000/version | \
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["version"] == "1.1.0", d; assert d["environment"] == "demo", d'
          echo "Version 1.1.0 verified"

      - name: Verify addition API
        run: |
          curl -fsS "http://127.0.0.1:8000/add?a=2&b=3" | \
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["result"] == 5.0, d'
          echo "Addition API verified"

      - name: Verify multiplication API
        run: |
          curl -fsS "http://127.0.0.1:8000/multiply?a=4&b=5" | \
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["result"] == 20.0, d'
          echo "Multiplication API verified"

      - name: Cleanup container
        if: always()
        run: docker rm -f nexus-cicd-cd 2>/dev/null || true

  rollback-verification:
    name: Automated Rollback Test
    needs: [docker-build, deploy-simulated]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current project
        uses: actions/checkout@v7

      - name: Checkout stable version 1.0.0
        uses: actions/checkout@v7
        with:
          ref: 4fe91999341ddf62440cb8ae6ea73e38ad2d9c7c
          path: fallback-v1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download Docker image
        uses: actions/download-artifact@v8
        with:
          name: nexus-docker-image

      - name: Verify Docker archive
        run: sha256sum -c nexus-cicd-api.tar.sha256

      - name: Load application image
        run: docker load -i nexus-cicd-api.tar

      - name: Build stable fallback image
        run: |
          docker build \
            -t nexus-cicd-api:1.0.0 \
            ./fallback-v1

      - name: Test successful deployment
        run: |
          bash scripts/deploy_with_rollback.sh \
            "$IMAGE_TAG" 1.1.0

      - name: Simulate failure and verify rollback
        run: |
          set +e
          bash scripts/deploy_with_rollback.sh \
            "$IMAGE_TAG" 9.9.9
          result=$?
          set -e

          if [ "$result" -ne 2 ]; then
            echo "Expected rollback exit code 2, got $result"
            exit 1
          fi

          echo "Rollback script reported successful recovery"

      - name: Verify restored stable version
        run: |
          curl -fsS http://127.0.0.1:8001/version | \
          python -c 'import json,sys; d=json.load(sys.stdin); assert d["version"] == "1.0.0", d'

          curl -fsS http://127.0.0.1:8001/health | \
          python -c 'import json,sys; d=json.load(sys.stdin); assert d["status"] == "ok", d'

          test "$(docker inspect --format '{{.Config.Image}}' nexus-cicd-rollback-demo)" = "nexus-cicd-api:1.0.0"

          echo "ROLLBACK VERIFIED: Version 1.0.0 restored"

      - name: Cleanup rollback container
        if: always()
        run: docker rm -f nexus-cicd-rollback-demo 2>/dev/null || true
