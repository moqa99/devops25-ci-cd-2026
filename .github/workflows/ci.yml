
name: NEXUS CI/CD Pipeline

on:
  push:
    branches:
      - main
      - "demo/**"

  pull_request:
    branches:
      - main

jobs:
  test-and-lint:
    name: Test and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v --junitxml=test-results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results.xml
          if-no-files-found: error
          retention-days: 14

      - name: Run Ruff
        run: python -m ruff check app tests

  docker-build:
    name: Build Docker Image
    needs: test-and-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t nexus-cicd-api:ci .

      - name: Verify Docker image
        run: docker image inspect nexus-cicd-api:ci

  deploy-simulated:
    name: Simulated Deployment
    needs: docker-build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build deployment image
        run: docker build -t nexus-cicd-api:ci .

      - name: Start application
        run: |
          docker run -d \
            --name nexus-cicd-cd \
            -p 8000:8000 \
            nexus-cicd-api:ci

      - name: Verify application health
        run: |
          for attempt in {1..15}; do
            if curl -fsS http://localhost:8000/health > health.json; then
              python3 -c 'import json; assert json.load(open("health.json")) == {"status": "ok"}'
              echo "Health check passed"
              exit 0
            fi
            sleep 2
          done
          docker logs nexus-cicd-cd
          exit 1

      - name: Verify deployed version
        run: |
          curl -fsS http://localhost:8000/version | \
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["version"] == "1.0.0", d; assert d["environment"] == "demo", d'
          echo "Correct version deployed"

      - name: Verify addition API
        run: |
          curl -fsS "http://localhost:8000/add?a=2&b=3" | \
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["result"] == 5.0, d'
          echo "API functionality verified"

      - name: Cleanup container
        if: always()
        run: docker rm -f nexus-cicd-cd 2>/dev/null || true
